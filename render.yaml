# Render Blueprint for the public demo: one Docker web service that serves the React build and
# the API from the same origin.
#
# Free plan on purpose - this needs no payment to sync. A free service sleeps after 15 minutes
# of inactivity and takes roughly a minute to wake, which the README states plainly.
#
# Secrets are never committed. SESSION_SECRET is generated by Render and then stays stable for
# the life of the service, so sessions survive restarts. DATABASE_URL and GROQ_API_KEY are
# entered once in the dashboard.
services:
  - type: web
    name: aivoa-complaint-copilot
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECURE_COOKIES
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: gemma2-9b-it
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REASONING_EFFORT
        value: low
